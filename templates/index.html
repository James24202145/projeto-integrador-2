<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CicloPonto - Pontos de Apoio Cicloviário</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Font Awesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        /* Legenda Fixa na Base (PC e Mobile) */
        .map-legend-bar {
            position: absolute;
            bottom: 20px;
            /*left: 20px;*/
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: white;
            padding: 8px 14px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 12px;
            font-weight: 500;
            color: #333;
        }
        .map-legend-bar .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .map-legend-bar .legend-pin-mini {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
        }
        @media (max-width: 768px) {
            .map-legend-bar {
                bottom: 15px;
                left: 10px;
                right: 10px;
                justify-content: space-around;
                padding: 6px 8px;
                gap: 5px;
            }
        }

        /* Comportamento responsivo da Sidebar e Botão Flutuante */
        @media (max-width: 768px) {
            .sidebar.mobile-hidden {
                display: none !important;
            }
            #toggleMenuBtn {
                display: flex !important;
            }
        }
        @media (min-width: 769px) {
            #toggleMenuBtn {
                display: none !important;
            }
            .btn-close-mobile {
                display: none !important;
            }
        }

        /* Estilo base do botão flutuante mobile */
        #toggleMenuBtn {
            position: absolute;
            top: 15px;
            left: 65px;
            z-index: 1050;
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

<!-- Botão flutuante visível apenas em telemóveis para abrir o menu -->
<button id="toggleMenuBtn" class="d-md-none">
    <i class="fa-solid fa-bars"></i> Menu & Filtros
</button>

<!-- Painel Lateral Flutuante -->
<div class="sidebar" id="sidebarPanel">
    <!-- Botão de Fechar no topo do painel para dispositivos móveis -->
    <div class="d-flex justify-content-end d-md-none" style="padding: 5px 5px 0 0;">
        <button id="closeMenuBtn" class="btn-close btn-close-mobile" aria-label="Fechar" style="background: none; border: none; font-size: 18px; cursor: pointer; color: #666;"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Abas do Painel -->
    <div class="sidebar-tabs">
        <button class="tab-btn active" onclick="mudarAba('explorar')"><i class="fa-solid fa-map"></i> Explorar</button>
        <button class="tab-btn" onclick="mudarAba('adicionar')"><i class="fa-solid fa-plus-circle"></i> Novo Ponto</button>
    </div>

    <!-- CONTEÚDO DA ABA: EXPLORAR -->
    <div id="aba-explorar" class="tab-conteudo">

        <!-- Widget de Clima -->
        <div id="weather-widget" style="display: flex; align-items: center; gap: 10px; background: #f1f8e9; padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #c8e6c9;">
            <img id="weather-icon" src="" alt="Clima" style="width: 36px; height: 36px; display: none;">
            <div style="font-size: 13px; color: #2e7d32;">
                <strong id="weather-temp">A carregar clima...</strong>
                <div id="weather-desc" style="font-size: 11px; color: #555; text-transform: capitalize;">São Paulo</div>
            </div>
        </div>

        <div class="brand">
            <i class="fa-solid fa-bicycle brand-icon"></i>
            <div>
                <h1>CicloPonto</h1>
                <p>Pontos de apoio cicloviários em SP</p>
            </div>
        </div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="input-busca" placeholder="Buscar por nome ou endereço...">
        </div>

        <div class="filter-section">
            <label class="filter-title">Filtros</label>

            <div class="form-group">
                <label for="select-tipo">Tipo de Ponto:</label>
                <select id="select-tipo">
                    <option value="todos">Todos os tipos</option>
                    <option value="Bicicletário">Bicicletário</option>
                    <option value="Paraciclo">Paraciclo</option>
                    <option value="Oficina / Suporte">Oficina / Suporte</option>
                </select>
            </div>

            <div class="checkbox-group">
                <label><input type="checkbox" id="check-gratuito"> Apenas Gratuitos</label>
                <label><input type="checkbox" id="check-coberto"> Apenas Cobertos</label>
            </div>
        </div>
        <div class="counter">
            <span id="total-pontos">0</span> pontos encontrados
        </div>
    </div>

    <!-- CONTEÚDO DA ABA: ADICIONAR NOVO PONTO -->
    <div id="aba-adicionar" class="tab-conteudo" style="display: none;">

        <!-- PASSO 1: Seleção de Coordenadas no Mapa -->
        <div id="novo-passo-1">
            <div style="margin-bottom: 12px;">
                <h2 style="font-size: 16px; color: #2e7d32; margin-bottom: 4px;"><i class="fa-solid fa-map-pin"></i> Novo Ponto</h2>
                <p id="texto-dica-mapa" style="font-size: 12px; color: #555; line-height: 1.4;">Selecione a localização no mapa.</p>
            </div>

            <div style="display: flex; gap: 6px; margin-bottom: 12px; width: 100%;">
                <div class="form-grupo" style="flex: 1; min-width: 0;">
                    <label for="novo-lat" style="font-size: 11px;">Latitude:</label>
                    <input type="text" id="novo-lat" readonly placeholder="Selecione..." style="width: 100%; box-sizing: border-box; padding: 6px 4px; border: 1px solid #ccc; border-radius: 6px; font-size: 11px; background: #f5f5f5; outline: none;">
                </div>
                <div class="form-grupo" style="flex: 1; min-width: 0;">
                    <label for="novo-lng" style="font-size: 11px;">Longitude:</label>
                    <input type="text" id="novo-lng" readonly placeholder="Selecione..." style="width: 100%; box-sizing: border-box; padding: 6px 4px; border: 1px solid #ccc; border-radius: 6px; font-size: 11px; background: #f5f5f5; outline: none;">
                </div>
            </div>

            <button type="button" id="btn-proximo-passo" class="btn-salvar" style="background-color: #ccc; width: 100%; padding: 10px; font-weight: 500; cursor: not-allowed;" disabled>
                Adicionar / Preencher Detalhes
            </button>
        </div>

        <!-- PASSO 2: Preenchimento de Detalhes (Oculto inicialmente) -->
        <form id="form-novo-ponto" style="display: none; flex-direction: column; gap: 10px; margin-top: 5px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <span style="font-size: 13px; font-weight: 600; color: #2e7d32;"><i class="fa-solid fa-pen-to-square"></i> Detalhes do Local</span>
                <button type="button" id="btn-voltar-passo-1" style="background: none; border: none; color: #0288d1; font-size: 12px; cursor: pointer;"><i class="fa-solid fa-arrow-left"></i> Alterar Local</button>
            </div>

            <div class="form-grupo">
                <label for="novo-nome">Nome do Local:</label>
                <input type="text" id="novo-nome" required placeholder="Ex: Bicicletário Estação X" style="padding: 7px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; outline: none; width: 100%; box-sizing: border-box;">
            </div>

            <div class="form-grupo">
                <label for="novo-tipo">Tipo de Ponto:</label>
                <select id="novo-tipo" style="padding: 7px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; outline: none; width: 100%; box-sizing: border-box;">
                    <option value="Bicicletário">Bicicletário</option>
                    <option value="Paraciclo">Paraciclo</option>
                    <option value="Oficina / Suporte">Oficina / Suporte</option>
                </select>
            </div>

            <div class="form-grupo">
                <label for="novo-endereco">Endereço:</label>
                <input type="text" id="novo-endereco" required placeholder="Rua, Número, Bairro..." style="padding: 7px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; outline: none; width: 100%; box-sizing: border-box;">
            </div>

            <div class="form-grupo">
                <label for="novo-vagas">Capacidade de Vagas:</label>
                <input type="number" id="novo-vagas" min="1" value="10" style="padding: 7px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; outline: none; width: 100%; box-sizing: border-box;">
            </div>

            <div class="checkbox-group" style="margin-top: 2px;">
                <label><input type="checkbox" id="novo-gratuito" checked> Local Gratuito</label>
                <label><input type="checkbox" id="novo-coberto"> Local Coberto</label>
                <label><input type="checkbox" id="novo-seguranca"> Possui Segurança</label>
            </div>

            <button type="submit" class="btn-salvar" style="margin-top: 4px; padding: 8px;">Guardar Ponto</button>
        </form>
    </div>

</div> <!-- Fim da Sidebar -->

<!-- Botão Tema Dia/Noite (Canto Superior Direito) -->
<div style="position: absolute; top: 15px; right: 10px; z-index: 1000;">
    <button onclick="alternarTema()" id="btn-tema" title="Alternar Modo Claro/Escuro" style="background-color: #2e7d32; color: white; border: none; border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.3);">
        <i class="fa-solid fa-moon" id="icone-tema"></i>
    </button>
</div>

<!-- Seletor de Tamanho de Fonte Compacto e Esguio (Canto Superior Direito) -->
<div style="position: absolute; top: 68px; right: 10px; z-index: 1000; display: flex; flex-direction: column; gap: 2px; background: white; padding: 3px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.25);">
    <button onclick="mudarTamanhoFonte('normal')" title="Fonte Normal" style="background: none; border: none; font-size: 11px; font-weight: bold; cursor: pointer; padding: 4px 4px; border-radius: 6px; text-align: center;">A</button>
    <button onclick="mudarTamanhoFonte('grande')" title="Fonte Grande" style="background: none; border: none; font-size: 13px; font-weight: bold; cursor: pointer; padding: 4px 4px; border-radius: 6px; text-align: center;">A+</button>
    <button onclick="mudarTamanhoFonte('muito-grande')" title="Fonte Muito Grande" style="background: none; border: none; font-size: 15px; font-weight: bold; cursor: pointer; padding: 4px 4px; border-radius: 6px; text-align: center;">A++</button>
</div>
<!-- Container do Mapa -->
<div id="map"></div>

<!-- Legenda Fixa na Base -->

<div class="map-legend-bar">
    <div class="legend-item">
        <div class="legend-pin-mini" style="background-color: #2e7d32;"><i class="fa-solid fa-bicycle"></i></div>
        <span>Bicicletário</span>
    </div>
    <div class="legend-item">
        <div class="legend-pin-mini" style="background-color: #0288d1;"><i class="fa-solid fa-square-parking"></i></div>
        <span>Paraciclo</span>
    </div>
    <div class="legend-item">
        <div class="legend-pin-mini" style="background-color: #e65100;"><i class="fa-solid fa-wrench"></i></div>
        <span>Oficina / Suporte</span>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- JavaScript Principal -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>

<!-- Script de controle do menu mobile (Já integrado no main.js, mantido limpo aqui) -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const sidebar = document.getElementById('sidebarPanel');
        const toggleBtn = document.getElementById('toggleMenuBtn');
        const closeBtn = document.getElementById('closeMenuBtn');

        if (window.innerWidth <= 768 && sidebar) {
            sidebar.classList.add('mobile-hidden');
        }

        if (toggleBtn && closeBtn && sidebar) {
            toggleBtn.addEventListener('click', function() {
                sidebar.classList.remove('mobile-hidden');
            });

            closeBtn.addEventListener('click', function() {
                sidebar.classList.add('mobile-hidden');
            });
        }
    });
</script>

<!-- Modal para Registar Ocorrência -->
<div id="modal-ocorrencia" class="modal" style="display: none;">
    <div class="modal-conteudo">
        <span class="fechar-modal" onclick="fecharModalOcorrencia()">&times;</span>
        <h2>Registar Ocorrência</h2>
        <form id="form-ocorrencia">
            <input type="hidden" id="ocorrencia-ponto-id">

            <div class="form-grupo">
                <label for="ocorrencia-tipo">Tipo de Ocorrência:</label>
                <select id="ocorrencia-tipo">
                    <option value="Vandalismo">Vandalismo</option>
                    <option value="Avaria/Estrutura Danificada">Avaria/Estrutura Danificada</option>
                    <option value="Ponto de Apoio Lotado">Ponto de Apoio Lotado</option>
                    <option value="Ocorrência de Furto/Roubo">Ocorrência de Furto/Roubo</option>
                    <option value="Ponto de Apoio Fechado">Ponto de Apoio Fechado</option>
                </select>
            </div>

            <div class="form-grupo">
                <label for="ocorrencia-descricao">Descrição:</label>
                <textarea id="ocorrencia-descricao" rows="4" maxlength="1000" required placeholder="Descreva o problema ou situação..."></textarea>
                <div id="contador-caracteres" style="font-size: 11px; color: #666; text-align: right; margin-top: 2px;">0/1000</div>
            </div>

            <button type="submit" class="btn-salvar">Guardar Ocorrência</button>
        </form>
    </div>
</div>

<!-- Modal para Exibir Detalhes da Ocorrência -->
<div id="modal-detalhe-ocorrencia" class="modal" style="display: none;">
    <div class="modal-conteudo">
        <span class="fechar-modal" onclick="fecharModalDetalhe()">&times;</span>
        <h2 id="detalhe-tipo" style="color: #d32f2f; margin-bottom: 4px;">Tipo de Ocorrência</h2>
        <p style="font-size: 12px; color: #666; margin-bottom: 12px;"><i class="fa-regular fa-clock"></i> <span id="detalhe-data"></span></p>
        <div class="form-grupo">
            <label>Descrição:</label>
            <p id="detalhe-descricao" style="background: #f9f9f9; padding: 10px; border-radius: 6px; border: 1px solid #ddd; max-height: 150px; overflow-y: auto; font-size: 14px; color: #333; word-break: break-word;"></p>
        </div>
    </div>
</div>

</body>
</html>
